<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HK Internet Bank - Next-Gen Web3 Digital Banking</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #0b0216; color: #f3e8ff; }
        .neon-glow { box-shadow: 0 0 25px rgba(168, 85, 247, 0.35); }
        .neon-border { border: 1px solid rgba(168, 85, 247, 0.45); }
        .neon-border-glow { border: 1px solid rgba(168, 85, 247, 0.7); box-shadow: inset 0 0 15px rgba(168, 85, 247, 0.2); }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0b0216; }
        ::-webkit-scrollbar-thumb { background: #2b104a; border-radius: 4px; border: 1px solid rgba(168, 85, 247, 0.3); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-purple-500 selection:text-white">

    <!-- BANK HEADER -->
    <header class="w-full bg-[#150726]/95 backdrop-blur-md border-b border-purple-900/60 sticky top-0 z-50 px-4 py-3.5 flex flex-wrap justify-between items-center shadow-xl">
        <div class="flex items-center space-x-3">
            <div class="w-3.5 h-3.5 bg-emerald-400 rounded-full animate-ping"></div>
            <h1 class="text-xl font-black tracking-wider bg-gradient-to-r from-purple-400 via-pink-400 to-purple-500 bg-clip-text text-transparent">
                HK INTERNET BANK <span class="text-xs text-purple-300 font-normal">v3.0 Secure Core</span>
            </h1>
        </div>
        <nav class="hidden md:flex items-center space-x-2 text-sm">
            <a href="#my-account" class="px-3 py-1.5 hover:text-purple-300 hover:bg-purple-900/40 rounded-xl transition">내 계좌</a>
            <a href="#transfer" class="px-3 py-1.5 hover:text-purple-300 hover:bg-purple-900/40 rounded-xl transition">간편송금</a>
            <a href="#products" class="px-3 py-1.5 hover:text-purple-300 hover:bg-purple-900/40 rounded-xl transition">예·적금</a>
            <a href="#ai-support" class="px-3 py-1.5 hover:text-purple-300 hover:bg-purple-900/40 rounded-xl transition">AGI 삐니 상담</a>
        </nav>
        <div class="flex items-center space-x-3 text-xs">
            <span class="px-3 py-1.5 bg-[#2b104a] rounded-xl neon-border font-mono">회장: <strong class="text-white">이재완(혜공)</strong></span>
            <span class="px-3 py-1.5 bg-purple-950 text-pink-400 rounded-xl neon-border font-mono">추천 ID: ljw2358</span>
        </div>
    </header>

    <!-- MAIN CONTENT CONTAINER -->
    <main class="flex-grow container mx-auto px-4 py-8 space-y-8 max-w-5xl">
        
        <!-- SECTION 1: MY ACCOUNT DASHBOARD -->
        <section id="my-account" class="w-full bg-[#150726] neon-border rounded-3xl p-6 sm:p-8 neon-glow relative overflow-hidden">
            <div class="absolute -right-16 -top-16 w-56 h-56 bg-purple-600/15 rounded-full blur-3xl pointer-events-none"></div>
            
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                <div>
                    <span class="text-xs font-mono px-3 py-1 bg-purple-950 text-purple-300 rounded-full border border-purple-800">HK BANK PRIMARY ACCOUNT</span>
                    <h2 class="text-2xl sm:text-3xl font-black mt-2 text-white">이재완 회장님 자산 대시보드</h2>
                </div>
                <div class="text-right">
                    <span class="text-xs text-emerald-400 font-mono block">● 실시간 연동 완료</span>
                    <span class="text-xs text-purple-400 font-mono">계좌번호: 2026-0520-7777</span>
                </div>
            </div>

            <!-- Balance Card -->
            <div class="bg-[#0b0216] rounded-2xl p-6 neon-border-glow grid grid-cols-1 md:grid-cols-3 gap-6 items-center">
                <div class="md:col-span-2 space-y-2">
                    <span class="text-xs text-purple-400 font-mono">총 보유 잔액 (Total Balance)</span>
                    <div class="text-3xl sm:text-4xl font-black text-white font-mono tracking-tight flex items-center gap-3">
                        <span>1,250,400,000</span> <span class="text-lg text-pink-400">HK-WON</span>
                    </div>
                    <p class="text-xs text-purple-300/70">Test Pi 연동 유동성 및 사회환원 기금 풀 실시간 반영 중</p>
                </div>
                <div class="flex flex-col gap-2.5">
                    <button onclick="alert('입금 계좌번호가 클립보드에 복사되었습니다.')" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold text-xs py-3 rounded-xl transition shadow-lg shadow-purple-900/40">
                        계좌 채우기 (입금)
